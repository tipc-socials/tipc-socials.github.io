name: Sync sheet and deploy

on:
  schedule:
    - cron: "7,37 * * * *" # pull the Google Sheet (off the busy :00/:30 marks)
    - cron: "17 6 1 * *" # monthly keepalive (see last step of the sync job)
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit updated data
      actions: write # keepalive re-enable
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch sheet
        run: python3 scripts/sync_sheet.py

      - name: Commit if the data changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain site/data)" ]; then
            echo "No changes in the sheet."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Sync socials from Google Sheet"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow through the API once a month resets that clock.
      - name: Keep the schedule alive
        if: github.event.schedule == '17 6 1 * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-sheet.yml/enable"

  deploy:
    needs: sync
    # Scheduled runs only redeploy when the sheet changed.
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # includes the data commit from the sync job

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
