<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIPC Socials</title>
  <meta name="description" content="Where the TIPC weekly social is this week, and everywhere we've been.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <h1 class="title">TIPC Socials</h1>
      <p class="tagline">
        Weekly drinks and where we've been.
        Have a suggestion? <a href="https://docs.google.com/spreadsheets/d/1bbNUhRT9cgd-hokt4XJx3N_Q7m18bZWIseVWDS8bN7s/edit" target="_blank" rel="noopener">Add it to the sheet</a>.
      </p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="schedule-title">
      <h2 id="schedule-title" class="section-title">Schedule</h2>
      <div id="schedule" aria-live="polite">
        <p class="status">Loading the schedule…</p>
      </div>
    </section>

    <section class="places" aria-labelledby="places-title">
      <h2 id="places-title" class="section-title">Places on the list</h2>
      <p class="section-sub">Spots we want to try, and their happy hours.</p>
      <ul class="place-list" id="places"></ul>
    </section>
  </main>

  <footer class="wrap footer">
    <p>Updated from the Google Sheet about every 30 minutes.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
